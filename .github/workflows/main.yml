name: Main

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    name: Scala Build
    outputs:
      version: ${{ steps.save-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: coursier/setup-action@v3
        with:
          jvm: adoptium:1.21.0.2
          apps: sbt
      - name: Cache SBT
        uses: actions/cache@v6
        with:
          path: |
            ~/.ivy2/cache
            ~/.cache/coursier
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/*.sbt') }}
      - name: Cache Build Files
        uses: actions/cache@v6
        with:
          path: |
            **/target
          key: ${{ runner.os }}-build-${{ github.sha }}
      - name: Build
        run: sbt "compile; js/fullLinkJS; cli/assembly"
      - id: save-version
        name: Save Version
        run: |
          version="$(sbt --server --error "print coreJVM/releaseVersion" | sed 's/\x1b\[[0-9;]*[A-Za-z]//g' | grep -E '^[0-9]' | tail -n1)"
          echo -n "version=$version"
          echo -n "version=$version" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v7
        with:
          path: target/recheck-js-opt/recheck.js
          name: recheck.js
      - uses: actions/upload-artifact@v7
        with:
          path: target/recheck.jar
          name: recheck.jar

  scala-lint:
    needs: [build]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    name: Scala Lint
    steps:
      - uses: actions/checkout@v7
      - uses: coursier/setup-action@v3
        with:
          jvm: adoptium:1.21.0.2
          apps: sbt
      - name: Cache SBT
        uses: actions/cache@v6
        with:
          path: |
            ~/.ivy2/cache
            ~/.cache/coursier
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/*.sbt') }}
      - name: Cache Build Files
        uses: actions/cache@v6
        with:
          path: |
            **/target
          key: ${{ runner.os }}-build-${{ github.sha }}
      - name: Lint
        run: sbt "scalafmtCheckAll; scalafmtSbtCheck; scalafixAll --check"

  node-lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    name: Node Lint
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: |
          pnpm -r run lint
      - name: Type Check
        run: |
          pnpm -r run typecheck

  scala-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    name: Scala Test
    steps:
      - uses: actions/checkout@v7
      - uses: coursier/setup-action@v3
        with:
          jvm: adoptium:1.21.0.2
          apps: sbt
      # This Node.js is needed for Scala tests, so we don't need to install dependencies.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Cache SBT
        uses: actions/cache@v6
        with:
          path: |
            ~/.ivy2/cache
            ~/.cache/coursier
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/*.sbt') }}
      - name: Test
        run: sbt "coverage; test; coverageAggregate"
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  node-test:
    needs: [build, node-lint]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    strategy:
      matrix:
        node: [ 22, 24, 26 ]
    name: Node v${{ matrix.node }} Test
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '12'
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: recheck.js
          path: target/recheck-js-opt/
      - uses: actions/download-artifact@v8
        with:
          name: recheck.jar
          path: target/
      - name: Build
        run: pnpm -r run build
      - name: Test
        run: pnpm -r run test --coverage --forceExit --detectOpenHandles
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  node-test-e2e:
    needs: [build, node-lint]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        backend: [pure, worker, java]
    name: Node E2E Test (${{ matrix.backend }})
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: recheck.js
          path: target/recheck-js-opt/
      - uses: actions/download-artifact@v8
        with:
          name: recheck.jar
          path: target/
      - name: Build
        run: pnpm --filter recheck run build
      - name: Test
        run: pnpm --filter recheck run test:e2e
        env:
          RECHECK_BACKEND: ${{ matrix.backend }}
          RECHECK_JAR: ${{ github.workspace }}/target/recheck.jar

  native-build:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/') || github.ref_name == 'main' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26-intel, macos-26, ubuntu-24.04, ubuntu-24.04-arm, windows-2025]
        include:
          - os: macos-26-intel
            artifact_filename: recheck-darwin-x64
            local_path: target/native-image/recheck
          - os: macos-26
            artifact_filename: recheck-darwin-arm64
            local_path: target/native-image/recheck
          - os: ubuntu-24.04
            artifact_filename: recheck-linux-x64
            local_path: target/native-image/recheck
          - os: ubuntu-24.04-arm
            artifact_filename: recheck-linux-arm64
            local_path: target/native-image/recheck
          - os: windows-2025
            artifact_filename: recheck-win32-x64.exe
            local_path: target/native-image/recheck.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    name: Scala Build (Native Binary)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: coursier/setup-action@v3
        with:
          jvm: graalvm-community:25.0.1
          apps: sbt
      - name: Cache SBT
        uses: actions/cache@v6
        with:
          path: |
            ~/.ivy2/cache
            ~/.cache/coursier
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/*.sbt') }}
      - name: Cache Build Files
        uses: actions/cache@v6
        with:
          path: |
            **/target
          key: ${{ runner.os }}-build-${{ github.sha }}
      - if: runner.os == 'Windows'
        name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - run: sbt cli/nativeImage
        env:
          NATIVE_IMAGE_INSTALLED: true
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.local_path }}
          name: ${{ matrix.artifact_filename }}

  node-test-e2e-native:
    needs: [build, node-lint, native-build]
    if: startsWith(github.ref, 'refs/tags/') || github.ref_name == 'main' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26-intel, macos-26, ubuntu-26.04, ubuntu-26.04-arm, windows-2025]
        include:
          - os: macos-26-intel
            artifact_filename: recheck-darwin-x64
            bin: recheck
          - os: macos-26
            artifact_filename: recheck-darwin-arm64
            bin: recheck
          - os: ubuntu-26.04
            artifact_filename: recheck-linux-x64
            bin: recheck
          - os: ubuntu-26.04-arm
            artifact_filename: recheck-linux-arm64
            bin: recheck
          - os: windows-2025
            artifact_filename: recheck-win32-x64.exe
            bin: recheck.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    name: Node E2E Test (native)
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: recheck.js
          path: target/recheck-js-opt/
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact_filename }}
          path: target/native-image/
      - if: runner.os != 'Windows'
        name: Make the binary executable
        run: chmod +x target/native-image/${{ matrix.bin }}
      - name: Build
        run: pnpm --filter recheck run build
      - name: Test
        run: pnpm --filter recheck run test:e2e
        env:
          RECHECK_BACKEND: native
          RECHECK_BIN: ${{ github.workspace }}/target/native-image/${{ matrix.bin }}

  maven-release:
    needs: [build, scala-test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    name: Publish to Maven Central
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: coursier/setup-action@v3
        with:
          jvm: adoptium:1.21.0.2
          apps: sbt
      - name: Cache SBT
        uses: actions/cache@v6
        with:
          path: |
            ~/.ivy2/cache
            ~/.cache/coursier
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/*.sbt') }}
      - name: Cache Build Files
        uses: actions/cache@v6
        with:
          path: |
            **/target
          key: ${{ runner.os }}-build-${{ github.sha }}
      - id: check-published
        name: Check whether the version is already published
        run: |
          if curl -sfI "https://repo1.maven.org/maven2/codes/quine/labs/recheck-core_3/${{ needs.build.outputs.version }}/" > /dev/null; then
            echo "published=true" >> $GITHUB_OUTPUT
          fi
      - name: Publish
        if: steps.check-published.outputs.published != 'true'
        run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}

  npm-release:
    needs: [build, native-build, node-test, node-test-e2e, node-test-e2e-native]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    name: Publish to NPM
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: coursier/setup-action@v3
        with:
          jvm: adoptium:1.21.0.2
          apps: sbt
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Cache SBT
        uses: actions/cache@v6
        with:
          path: |
            ~/.ivy2/cache
            ~/.cache/coursier
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/*.sbt') }}
      - name: Cache Build Files
        uses: actions/cache@v6
        with:
          path: |
            **/target
          key: ${{ runner.os }}-build-${{ github.sha }}
      - name: Install
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: recheck.js
          path: target/recheck-js-opt/
      - uses: actions/download-artifact@v8
        with:
          name: recheck.jar
          path: packages/recheck-jar/
      - uses: actions/download-artifact@v8
        with:
          name: recheck-darwin-x64
          path: packages/recheck-macos-x64/
      - uses: actions/download-artifact@v8
        with:
          name: recheck-darwin-arm64
          path: packages/recheck-macos-arm64/
      - uses: actions/download-artifact@v8
        with:
          name: recheck-linux-x64
          path: packages/recheck-linux-x64/
      - uses: actions/download-artifact@v8
        with:
          name: recheck-linux-arm64
          path: packages/recheck-linux-arm64/
      - uses: actions/download-artifact@v8
        with:
          name: recheck-win32-x64.exe
          path: packages/recheck-windows-x64/
      - name: Build
        run: NODE_ENV=production pnpm -r run build
      - name: Version
        run: pnpm -r version ${{ needs.build.outputs.version }}
      # The version bump above is never committed, so the git checks cannot pass.
      - name: Publish (beta)
        if: contains(github.ref, '-beta')
        run: pnpm -r publish --no-git-checks --tag next
      - name: Publish
        if: "!contains(github.ref, '-beta')"
        run: pnpm -r publish --no-git-checks

  release:
    needs: [maven-release, npm-release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    name: Publish GitHub Release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: recheck.jar
          path: packages/recheck-jar/
      - uses: actions/download-artifact@v8
        with:
          name: recheck-darwin-x64
          path: packages/recheck-macos-x64/
      - uses: actions/download-artifact@v8
        with:
          name: recheck-darwin-arm64
          path: packages/recheck-macos-arm64/
      - uses: actions/download-artifact@v8
        with:
          name: recheck-linux-x64
          path: packages/recheck-linux-x64/
      - uses: actions/download-artifact@v8
        with:
          name: recheck-linux-arm64
          path: packages/recheck-linux-arm64/
      - uses: actions/download-artifact@v8
        with:
          name: recheck-win32-x64.exe
          path: packages/recheck-windows-x64/
      - name: Rename files
        run: |
          mv packages/recheck-jar/recheck.jar recheck.jar
          mv packages/recheck-macos-x64/recheck recheck-macos-x64
          mv packages/recheck-macos-arm64/recheck recheck-macos-arm64
          mv packages/recheck-linux-x64/recheck recheck-linux-x64
          mv packages/recheck-linux-arm64/recheck recheck-linux-arm64
          mv packages/recheck-windows-x64/recheck.exe recheck-windows-x64.exe
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            recheck.jar
            recheck-macos-x64
            recheck-macos-arm64
            recheck-linux-x64
            recheck-linux-arm64
            recheck-windows-x64.exe

  gh-pages-build:
    needs: [build]
    if: github.ref_name == 'main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    name: Build website
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - uses: actions/download-artifact@v8
        with:
          name: recheck.js
          path: target/recheck-js-opt/
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: |
          NODE_ENV=production pnpm --filter recheck run build
          RECHECK_VERSION=${{ needs.build.outputs.version }} pnpm --filter website run doc
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  gh-pages-deploy:
    needs: [gh-pages-build]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    name: Deploy to GitHub Pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
