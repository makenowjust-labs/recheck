[tools]
java = "temurin-27.0.1"
sbt = "2.0.12"
node = "26.13.0"
pnpm = "12.18.0"
python = "3.15.2"
ruby = "4.0.9"
dotnet = "10.0.403"
perl = "5.44.0.0"

# The tests of icu compile programs with ICU 79.1: the prebuilt binaries on Linux (x64 only), and static libraries built
# from the sources on macOS, whose shared libraries built here do not load without `DYLD_LIBRARY_PATH`.
[tools."http:icu4c"]
version = "79.1"
os = ["linux", "macos"]
strip_components = 1
bin_path = "bin"
postinstall = '''
cd "$MISE_TOOL_INSTALL_PATH" &&
if [ -d source ]; then
  mkdir .build && cd .build &&
  ../source/configure --prefix="$MISE_TOOL_INSTALL_PATH" --enable-static --disable-shared \
    --disable-tests --disable-samples --disable-extras --disable-layoutex --disable-icuio &&
  make -j"$(getconf _NPROCESSORS_ONLN)" install &&
  cd .. && rm -rf .build source
fi
'''

[tools."http:icu4c".platforms]
linux-x64 = { url = "https://github.com/unicode-org/icu/releases/download/release-{{ version }}/icu4c-{{ version }}-Ubuntu24.04-x64.tgz", bin_path = "usr/local/bin" }
macos-arm64 = { url = "https://github.com/unicode-org/icu/releases/download/release-{{ version }}/icu4c-{{ version }}-sources.tgz" }
macos-x64 = { url = "https://github.com/unicode-org/icu/releases/download/release-{{ version }}/icu4c-{{ version }}-sources.tgz" }

[env]
# The tests of icu compile programs with this command line, where the prebuilt shared libraries on Linux need a run path.
# The run path is an old `DT_RPATH` (`--disable-new-dtags`), which also finds `libicudata` that `libicuuc` loads.
RECHECK_ICU = { value = "{% if tools['http:icu4c'] is defined %}{% set icu = tools['http:icu4c'].path %}{% if os() == 'linux' %}{% set icu = icu ~ '/usr/local' %}{% endif %}c++ -I{{ icu }}/include -L{{ icu }}/lib{% if os() == 'linux' %} -Wl,--disable-new-dtags,-rpath,{{ icu }}/lib{% endif %}{% endif %}", tools = true }
# The tests of python-regex need Python's regex package, which `mise run python-requirements` installs here.
_.python.venv = { path = ".venv", create = true }

[settings]
# A virtual environment made by uv has no pip.
python.venv_stdlib = true

[tasks.python-requirements]
description = "Install the Python packages of requirements.txt into the virtual environment"
run = "python3 -m pip install --disable-pip-version-check --quiet -r requirements.txt"
