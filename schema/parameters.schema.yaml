# This file is the JSON Schema of recheck's parameters, but it is written in YAML for readability.
# This file is used to generate the Scala, JavaScript and TypeScript code of the parameters.
#
# Annotations:
#
# - `title`: the label in the Playground and in error messages.
# - `description`: Markdown used in Scaladoc, TypeScript docs, the website and (the first paragraph) the CLI help.
# - `x-scala-type`: the Scala type of the field.
# - `x-scala-values`: the Scala value of each `enum` value.
# - `x-typescript-type`: the TypeScript type when the JSON type does not tell it.
# - `x-unit`: `milliseconds` for a duration, which is a number of milliseconds in JSON and a `Duration` in Scala.
#   `null` means infinite.
# - `x-cli`: the long option name of the CLI, and `x-cli-metavar` its metavar when it differs from the title.
# - `x-exclude`: the targets not exposing the parameter (`cli`, `eslint-plugin`, `playground`).
# - `x-since`: the first release having the parameter, so that the Playground hides it on older releases.
# - `x-scala-default`: the Scala value of the default when `x-scala-values` does not give it.
#
# Annotations of the variants of `dialect` with settings, and of their settings:
#
# - `title`: the name of the dialect in the Playground (e.g. `.NET` for `dotnet`).
# - `x-scala-type`: the Scala type of the variant (e.g. `Dialect.Python`), or of the setting, which is `Boolean` or an enum
#   whose companion has `of(name)` (e.g. `Dialect.Python.Type`).
# - `x-cli-help`: the help of the CLI option of the setting, which is `--<dialect>-<setting>`.
#   A boolean setting whose default is `true` is `--no-<dialect>-<setting>`, and the help tells the `false` case.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://makenowjust-labs.github.io/recheck/parameters.schema.json"
title: "Parameters"
description: "Parameters is the set of the parameters of the analysis."
type: object
additionalProperties: false
properties:
  accelerationHitRatio:
    title: "Acceleration Hit Ratio"
    description: |-
      The ratio of the hits to the lookups of the memoization table under which a run of the VM stops the acceleration.

      A run looks up the table again and again, and it stops memoizing when the hits are fewer than this ratio of the lookups so far.
      With `0`, it never stops.
    type: number
    default: 0.01
    x-scala-type: "Double"
    x-cli: "acceleration-hit-ratio"
    x-since: "5.0.0"

  accelerationMode:
    title: "Acceleration Mode"
    description: |-
      The acceleration mode of the fuzzing.

      - `auto` turns it on as `on` does, unless the pattern has back-references, where it is on only for the runs that confirm an attack string.
      - `on` turns it on, unless the pattern has backtracking control verbs (e.g. `(*PRUNE)`) or non-atomic look-arounds (e.g. `(?*...)`), which memoization does not follow.
      - `off` turns it off.
    type: string
    enum: ["auto", "on", "off"]
    default: "auto"
    x-scala-type: "AccelerationMode"
    x-scala-values: { "auto": "AccelerationMode.Auto", "on": "AccelerationMode.On", "off": "AccelerationMode.Off" }
    x-cli: "acceleration-mode"
    x-cli-metavar: "mode"
    x-since: "4.2.0"

  alphabetRepresentative:
    title: "Alphabet Representative"
    description: |-
      The character that stands for a set of characters in an attack string.

      - `pretty` is a character that looks good in an attack string, outside Latin-1 (U+0000 to U+00FF) if the set has one.
        It is the first one that the set has of `あ`, `α`, `Ω`, `字`, `０`, `、`, `∆` and the ideographic space, or else the smallest letter, number, punctuation or symbol outside Latin-1, the smallest character outside Latin-1, the smallest printable ASCII character, or the smallest character.
      - `non-latin1` is the smallest character outside Latin-1, or the smallest one if the set has none.
      - `smallest` is the smallest character.

      An engine may optimize the matching against a string of only Latin-1 characters (e.g. V8), so an attack string with another character is more likely to work there.
    type: string
    enum: ["pretty", "non-latin1", "smallest"]
    default: "pretty"
    x-scala-type: "AlphabetRepresentative"
    x-scala-values:
      "pretty": "AlphabetRepresentative.Pretty"
      "non-latin1": "AlphabetRepresentative.NonLatin1"
      "smallest": "AlphabetRepresentative.Smallest"
    x-cli: "alphabet-representative"
    x-cli-metavar: "representative"
    x-since: "5.0.0"

  attackLimit:
    title: "Attack Limit"
    description: |-
      The upper limit of the VM's steps when the fuzz checker runs an attack string.

      A step is a character that the VM reads, including each character that a back-reference compares.
      The fuzz checker also sizes the attack string to reach this number of steps.
    type: integer
    default: 1500000000
    x-scala-type: "Int"
    x-cli: "attack-limit"
    x-since: "1.0.0"

  attackStringCharacteristics:
    title: "Attack String Characteristics"
    description: |-
      The characteristics of an attack string that tell an attack from a refuted one.

      An attack with the same complexity, hotspots and characteristics as a refuted one is not run on the runtime.
      An engine may refute an attack and confirm another that differs only in its characters (e.g. V8, which is faster on a string of only Latin-1 characters).
      Finer characteristics tell more attacks apart, and more of them are run on the runtime.

      - `none` is no characteristics.
      - `latin1` is whether the string has a character outside Latin-1 (U+0000 to U+00FF).
      - `char-class` is the sets of characters of the pattern that the characters of the string belong to, where the pattern divides all the characters into the sets that its parts read alike, without the sets of its literal characters.
      - `alphabet` is those sets with the ones of the literal characters.
    type: string
    enum: ["none", "latin1", "char-class", "alphabet"]
    default: "latin1"
    x-scala-type: "AttackStringCharacteristics"
    x-scala-values:
      {
        "none": "AttackStringCharacteristics.None",
        "latin1": "AttackStringCharacteristics.Latin1",
        "char-class": "AttackStringCharacteristics.CharClass",
        "alphabet": "AttackStringCharacteristics.Alphabet",
      }
    x-cli: "attack-string-characteristics"
    x-cli-metavar: "characteristics"
    x-since: "5.0.0"

  attackTimeout:
    title: "Attack Timeout"
    description: "The upper limit of matching time on the attack."
    type: [integer, "null"]
    default: 1000
    x-unit: "milliseconds"
    x-scala-type: "Duration"
    x-cli: "attack-timeout"
    x-since: "4.2.0"

  boundedWidthRatio:
    title: "Bounded Width Ratio"
    description: |-
      The ratio to the bounded width of the pattern of the length of the repeated parts beyond which the fuzz checker confirms an attack string.

      The bounded width of a pattern is the largest width of what it matches when each repetition without the largest count iterates the least times.
      The fuzz checker confirms the growth of the steps of an attack string on a repeat count whose repeated parts are longer than the bounded width times this ratio.
      It also takes the steps of the shorter strings as bounded by this length, when it skips the fuzzing of a pattern whose steps grow linearly beyond the counts of its repetitions.
    type: number
    default: 2
    x-scala-type: "Double"
    x-cli: "bounded-width-ratio"
    x-since: "5.0.0"

  checker:
    title: "Checker"
    description: |-
      The checker to use.

      - `auto` chooses one of the two below by the criteria.
      - `fuzz` uses the fuzzing with static analysis.
      - `automaton` uses the algorithm based on automata theory.
    type: string
    enum: ["auto", "fuzz", "automaton"]
    default: "auto"
    x-scala-type: "Checker"
    x-scala-values: { "auto": "Checker.Auto", "fuzz": "Checker.Fuzz", "automaton": "Checker.Automaton" }
    x-cli: "checker"
    x-since: "1.0.0"

  crossoverSize:
    title: "Crossover Size"
    description: "The number of crossovers on each generation."
    type: integer
    default: 25
    x-scala-type: "Int"
    x-cli: "crossover-size"
    x-since: "4.2.0"

  dialect:
    title: "Dialect"
    description: |-
      The regular expression dialect of the pattern, with its settings.

      It is the name of the dialect, which takes the default settings, or an object of the name and the settings (e.g. `"python"` or `{ "name": "python", "type": "bytes" }`).
      The flags are the dialect's own flag letters.
      See [Dialects](/docs/usage/dialects) for the dialects and their settings.
    oneOf:
      - type: string
        enum: ["javascript", "java", "dotnet", "pcre", "python", "ruby", "perl"]
      - type: object
        title: "JavaScript"
        properties:
          name: { const: "javascript" }
        required: ["name"]
        additionalProperties: false
      - type: object
        title: "Java"
        properties:
          name: { const: "java" }
        required: ["name"]
        additionalProperties: false
      - type: object
        title: ".NET"
        properties:
          name: { const: "dotnet" }
        required: ["name"]
        additionalProperties: false
      - type: object
        title: "PCRE"
        properties:
          name: { const: "pcre" }
        required: ["name"]
        additionalProperties: false
      - type: object
        title: "Python"
        properties:
          name: { const: "python" }
          type:
            title: "Python Type"
            enum: ["str", "bytes"]
            default: "str"
            x-scala-type: "Dialect.Python.Type"
            x-cli-help: "The string type."
        required: ["name"]
        additionalProperties: false
        x-scala-type: "Dialect.Python"
      - type: object
        title: "Ruby"
        properties:
          name: { const: "ruby" }
          encoding:
            title: "Ruby Encoding"
            enum: ["UTF-8", "ASCII-8BIT"]
            default: "UTF-8"
            x-scala-type: "Dialect.Ruby.Encoding"
            x-cli-help: "The encoding."
        required: ["name"]
        additionalProperties: false
        x-scala-type: "Dialect.Ruby"
      - type: object
        title: "Perl"
        properties:
          name: { const: "perl" }
          utf8:
            title: "Perl UTF-8"
            type: boolean
            default: true
            x-scala-type: "Boolean"
            x-cli-help: "The program has no `use utf8`, and its strings are bytes."
          source:
            title: "Perl Source"
            enum: ["literal", "string"]
            default: "literal"
            x-scala-type: "PerlSource"
            x-cli-help: "How the pattern is given."
        required: ["name"]
        additionalProperties: false
        x-scala-type: "Dialect.Perl"
    default: "javascript"
    x-scala-type: "Dialect"
    x-typescript-type: "DialectParameter"
    x-scala-default: "Dialect.JavaScript"
    x-cli: "dialect"
    x-exclude: ["eslint-plugin"]
    x-since: "5.0.0"

  incubationLimit:
    title: "Incubation Limit"
    description: |-
      The upper limit of the VM's steps when the fuzz checker runs a gene string on incubation.

      `static` seeding also sizes its seed strings to reach this number of steps.
    type: integer
    default: 25000
    x-scala-type: "Int"
    x-cli: "incubation-limit"
    x-since: "3.0.0"

  incubationTimeout:
    title: "Incubation Timeout"
    description: "The upper limit of matching time on incubation."
    type: [integer, "null"]
    default: 250
    x-unit: "milliseconds"
    x-scala-type: "Duration"
    x-cli: "incubation-timeout"
    x-since: "4.2.0"

  logger:
    title: "Logger"
    description: |-
      The logger function to record execution traces.

      `null` in TypeScript or `None` in Scala disables the logging.
      The CLI enables it with `--enable-log`.
    default: null
    x-scala-type: "Option[Context.Logger]"
    x-typescript-type: "(message: string) => void"
    x-exclude: ["cli", "eslint-plugin", "playground"]
    x-since: "4.2.0"

  maxAttackCandidates:
    title: "Max Attack Candidates"
    description: "The maximum number of attack candidates, the strings whose steps grow more than linearly as they repeat, that each generation collects on fuzzing before the attacks."
    type: integer
    default: 8
    x-scala-type: "Int"
    x-cli: "max-attack-candidates"
    x-since: "5.0.0"

  maxAttackStringSize:
    title: "Max Attack String Size"
    description: "The maximum length of the attack string on fuzzing."
    type: integer
    default: 300000
    x-scala-type: "Int"
    x-cli: "max-attack-string-size"
    x-since: "4.2.0"

  maxBackReferenceStrings:
    title: "Max Back-Reference Strings"
    description: |-
      The maximum number of strings that the groups referred by back-references match together, up to which the automaton checker expands the back-references.

      With more strings, or back-references that it does not expand, the automaton checker bounds the complexity from above, and the fuzz checker decides it (see [Criteria](/docs/internals/criteria)).
    type: integer
    default: 100
    x-scala-type: "Int"
    x-cli: "max-back-reference-strings"
    x-since: "5.0.0"

  maxBoostIteration:
    title: "Max Boost Iteration"
    description: |-
      The maximum number of times that the fuzz checker boosts an attack candidate.

      Each time, it adds a character or a repetition of a character to the string of the steepest candidate, and it goes on from the one whose steps grow steeper.
      With `0`, it attacks with the candidates as they are.
    type: integer
    default: 10
    x-scala-type: "Int"
    x-cli: "max-boost-iteration"
    x-since: "5.0.0"

  maxDFASize:
    title: "Max DFA Size"
    description: "The maximum size of the DFA to determine which algorithm is used."
    type: integer
    default: 20000
    x-scala-type: "Int"
    x-cli: "max-dfa-size"
    x-since: "5.0.0"

  maxDegree:
    title: "Max Degree"
    description: "The maximum degree to be considered in fuzzing."
    type: integer
    default: 4
    x-scala-type: "Int"
    x-cli: "max-degree"
    x-since: "1.1.0"

  maxExtraDegree:
    title: "Max Extra Degree"
    description: |-
      The maximum number of degrees above `maxDegree` that the fuzz checker tells from the exponential growth.

      The fuzz checker runs a string on consecutive repeat counts, and it takes the growth of the steps for a polynomial up to the degree of `maxDegree` plus this value, or else for the exponential one.
    type: integer
    default: 3
    x-scala-type: "Int"
    x-cli: "max-extra-degree"
    x-since: "5.0.0"

  maxGeneStringSize:
    title: "Max Gene String Size"
    description: "The maximum length of the gene string on fuzzing."
    type: integer
    default: 2400
    x-scala-type: "Int"
    x-cli: "max-gene-string-size"
    x-since: "4.2.0"

  maxGenerationSize:
    title: "Max Generation Size"
    description: "The maximum size of each generation on fuzzing."
    type: integer
    default: 100
    x-scala-type: "Int"
    x-cli: "max-generation-size"
    x-since: "1.0.0"

  maxIncubationBoundedWidth:
    title: "Max Incubation Bounded Width"
    description: |-
      The maximum bounded width of the pattern up to which the fuzz checker measures the growth of a gene string beyond the bounded width on incubation.

      The bounded width of a pattern is the largest width of what it matches when each repetition without the largest count iterates the least times.
      The steps of a string grow as on an attack string only when its repeated parts are longer than the bounded width, which takes long to run for a large one.
    type: integer
    default: 256
    x-scala-type: "Int"
    x-cli: "max-incubation-bounded-width"
    x-since: "5.0.0"

  maxInitialGenerationSize:
    title: "Max Initial Generation Size"
    description: "The maximum size of the initial generation on fuzzing."
    type: integer
    default: 500
    x-scala-type: "Int"
    x-cli: "max-initial-generation-size"
    x-since: "4.2.0"

  maxIteration:
    title: "Max Iteration"
    description: "The maximum number of fuzzing iterations."
    type: integer
    default: 10
    x-scala-type: "Int"
    x-cli: "max-iteration"
    x-since: "1.0.0"

  maxNFASize:
    title: "Max NFA Size"
    description: "The maximum size of the NFA to determine which algorithm is used, and of the NFA on `static` seeding."
    type: integer
    default: 70000
    x-scala-type: "Int"
    x-cli: "max-nfa-size"
    x-since: "1.0.0"

  maxPatternSize:
    title: "Max Pattern Size"
    description: "The maximum size of the regular expression pattern to determine which algorithm is used."
    type: integer
    default: 1500
    x-scala-type: "Int"
    x-cli: "max-pattern-size"
    x-since: "1.1.1"

  maxRefutedAttacks:
    title: "Max Refuted Attacks"
    description: |-
      The maximum number of attacks that the runtime attacks refute.

      When the runtime attacks refute this many attacks, the checking stops, and the result is `unknown` with the `runtime-attacks-refuted` error.
    type: integer
    default: 10
    x-scala-type: "Int"
    x-cli: "max-refuted-attacks"
    x-since: "5.0.0"

  maxRepeatCount:
    title: "Max Repeat Count"
    description: "The maximum sum of the repeat counts of the repetition quantifiers to determine which algorithm is used."
    type: integer
    default: 30
    x-scala-type: "Int"
    x-cli: "max-repeat-count"
    x-since: "1.0.0"

  maxRuntimeAttackStringSize:
    title: "Max Runtime Attack String Size"
    description: "The maximum length of the attack string in the diagnostics, which the runtime attack runs."
    type: integer
    default: 300000
    x-scala-type: "Int"
    x-cli: "max-runtime-attack-string-size"
    x-since: "5.0.0"

  maxSimpleRepeatCount:
    title: "Max Simple Repeat Count"
    description: "The maximum sum of the repeat counts of the repetition quantifiers on `static` seeding."
    type: integer
    default: 100
    x-scala-type: "Int"
    x-cli: "max-simple-repeat-count"
    x-since: "4.2.0"

  mutationSize:
    title: "Mutation Size"
    description: "The number of mutations on each generation."
    type: integer
    default: 50
    x-scala-type: "Int"
    x-cli: "mutation-size"
    x-since: "4.2.0"

  randomSeed:
    title: "Random Seed"
    description: "The PRNG seed number."
    type: integer
    default: 0
    x-scala-type: "Long"
    x-cli: "random-seed"
    x-since: "4.0.0"

  runtimeAttackLimit:
    title: "Runtime Attack Limit"
    description: |-
      The number of steps that the attack string in the diagnostics is sized for.

      It is not a limit of the VM.
      The repeat count of the attack string, which the runtime attack runs, is chosen so that a backtracking matcher reads about this many characters, counted as the VM counts its steps (see `attackLimit`).
    type: integer
    default: 1500000000
    x-scala-type: "Int"
    x-cli: "runtime-attack-limit"
    x-since: "5.0.0"

  runtimeAttackTimeout:
    title: "Runtime Attack Timeout"
    description: |-
      The upper limit of matching time on the runtime attack.

      The runtime attack runs the attack string on the real engine of the dialect (see [Runtime-Attack Verification](/docs/usage/runtime-attack-verification)).
      An attack string that the engine matches within this time is refuted: it is recorded in `refutedAttacks` of the diagnostics, and the checking goes on.
      The time is also bounded by the time left of `timeout`.
      The runtime attack is skipped if this value is not positive, or where commands cannot run (e.g. in the browser).
    type: [integer, "null"]
    default: -1000
    x-unit: "milliseconds"
    x-scala-type: "Duration"
    x-cli: "runtime-attack-timeout"
    x-since: "5.0.0"

  seeder:
    title: "Seeder"
    description: |-
      The seeder of the fuzzing.

      - `static` uses the seeding based on automata theory.
      - `dynamic` uses the seeding with dynamic analysis.
    type: string
    enum: ["static", "dynamic"]
    default: "static"
    x-scala-type: "Seeder"
    x-scala-values: { "static": "Seeder.Static", "dynamic": "Seeder.Dynamic" }
    x-cli: "seeder"
    x-since: "4.2.0"

  seedingLimit:
    title: "Seeding Limit"
    description: "The upper limit of the VM's steps on `dynamic` seeding."
    type: integer
    default: 1000
    x-scala-type: "Int"
    x-cli: "seeding-limit"
    x-since: "4.2.0"

  seedingTimeout:
    title: "Seeding Timeout"
    description: "The upper limit of matching time on `dynamic` seeding."
    type: [integer, "null"]
    default: 100
    x-unit: "milliseconds"
    x-scala-type: "Duration"
    x-cli: "seeding-timeout"
    x-since: "4.2.0"

  timeout:
    title: "Timeout"
    description: |-
      The upper limit of checking time.

      When it is exceeded, the result is `unknown` with the `timeout` error.
      It has no limit if it is infinite in Scala or `null` in TypeScript.
      The time starts when the check starts, not while the check waits in a queue.
      In TypeScript, it is in milliseconds.
    type: [integer, "null"]
    default: 10000
    x-unit: "milliseconds"
    x-scala-type: "Duration"
    x-cli: "timeout"
    x-since: "1.0.0"
