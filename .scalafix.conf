rules = [
  ExplicitResultTypes,
  RemoveUnused,
  LeakingImplicitClassVal,
  OrganizeImports,
]

OrganizeImports {
  blankLines = Manual
  expandRelative = true
  targetDialect = Scala3
  groups = [
    "java."
    "javax."
    "scala."
    "org.scalajs."
    "---"
    "cats."
    "com.monovore."
    "fastparse."
    "io.circe"
    "---"
    "*"
  ]
}

# Scalafix bundles the compiler artifacts only for the Scala LTS versions.
ExplicitResultTypes.fetchScala3CompilerArtifactsOnVersionMismatch = true
