rules = [
  ExplicitResultTypes,
  RemoveUnused,
  LeakingImplicitClassVal,
  OrganizeImports,
]

OrganizeImports {
  blankLines = Manual
  expandRelative = true
  targetDialect = Scala3
  groups = [
    "java."
    "javax."
    "scala."
    "org.scalajs."
    "---"
    "cats."
    "com.monovore."
    "io.circe"
    "---"
    "*"
  ]
}

ExplicitResultTypes.fetchScala3CompilerArtifactsOnVersionMismatch = true
